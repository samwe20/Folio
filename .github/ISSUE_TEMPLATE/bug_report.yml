name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (desktop)
        - Web / PWA (browser)
        - iPhone PWA
        - Native iOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Folio version
      placeholder: e.g. 1.0.4
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. … 2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

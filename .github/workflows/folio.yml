name: Folio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Build Windows application and installer
        run: npm run desktop:build -- --bundles nsis
      - name: Install Folio and its WebView2 prerequisite
        shell: pwsh
        run: |
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $installDirectory = Join-Path $env:RUNNER_TEMP 'Folio Installed'
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDirectory" -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installer failed: $($installation.ExitCode)" }
          $executable = Join-Path $installDirectory 'folio.exe'
          if (!(Test-Path -LiteralPath $executable)) { throw 'Installed executable is missing' }
          # Tauri patches bundle metadata (UNK -> NSS) in the packaged executable.
          # Compare with the actual installer payload, not the standalone binary.
          $payloadDirectory = Join-Path $env:RUNNER_TEMP 'Folio Payload'
          & 7z e $installer.FullName folio.exe "-o$payloadDirectory" -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect installer payload' }
          if ((Get-FileHash $executable).Hash -ne (Get-FileHash (Join-Path $payloadDirectory 'folio.exe')).Hash) { throw 'Installed executable differs from installer payload' }
          "FOLIO_DESKTOP_EXE=$executable" >> $env:GITHUB_ENV
      - name: Enable Folio automation on the ephemeral runner
        shell: pwsh
        run: |
          # Hosted Windows runners are elevated. Recent WebView2 ignores
          # WEBVIEW2_* environment overrides in elevated processes.
          # https://learn.microsoft.com/microsoft-edge/webview2/concepts/security
          $policyRoot = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          New-Item "$policyRoot\AdditionalBrowserArguments" -Force | Out-Null
          $debugArgs = '--remote-debugging-port=9224 --remote-allow-origins=*'
          New-ItemProperty "$policyRoot\AdditionalBrowserArguments" -Name 'folio.exe' -PropertyType String -Value $debugArgs -Force | Out-Null
          $configured = (Get-ItemProperty "$policyRoot\AdditionalBrowserArguments").'folio.exe'
          if ($configured -ne $debugArgs) { throw "WebView2 debugging policy not applied: $configured" }
          New-Item "$policyRoot\UserDataFolder" -Force | Out-Null
          New-ItemProperty "$policyRoot\UserDataFolder" -Name 'folio.exe' -PropertyType String -Value (Join-Path (Get-Location) 'test-results/desktop/webview-profile') -Force | Out-Null
      - name: Prepare desktop smoke test
        shell: pwsh
        run: |
          Get-Process folio -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
      - name: Test the actual Windows application
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_on: error
          command: npm run test:desktop
      - name: Read Folio version
        id: folio_version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish the installer as a single file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: folio-${{ steps.folio_version.outputs.version }}
          name: Folio ${{ steps.folio_version.outputs.version }} pro Windows
          body_path: docs/release-latest.md
          prerelease: false
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Remove Folio automation configuration
        if: always()
        shell: pwsh
        run: |
          $policyRoot = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          Remove-ItemProperty "$policyRoot\AdditionalBrowserArguments" -Name 'folio.exe' -ErrorAction SilentlyContinue
          Remove-ItemProperty "$policyRoot\UserDataFolder" -Name 'folio.exe' -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-windows
          path: |
            src-tauri/target/release/folio.exe
            src-tauri/target/release/bundle/nsis/*.exe
            test-results/desktop/*.png
            test-results/desktop/*.json
            test-results/desktop/*.html
            test-results/desktop/*.log
            src-tauri/Cargo.lock
  web:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:offline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-browser-results
          path: test-results

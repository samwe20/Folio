<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Folio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f3efe4" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http:; connect-src 'self';"
    />
    <title>Folio</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app" class="app sidebar-collapsed" data-theme="light">
      <div class="scrim hidden" id="scrim" aria-hidden="true"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="brand-copy">
            <span class="brand-name" data-i18n="sidebar.files">Soubory</span>
          </div>
          <div class="sidebar-actions">
            <button class="icon-btn" id="btn-new-note" data-i18n-title="action.newNote" data-i18n-aria-label="action.newNote" title="Nová poznámka" aria-label="Nová poznámka">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="icon-btn" id="btn-open-library" data-i18n-title="action.openLibrary" data-i18n-aria-label="action.openLibrary" title="Otevřít knihovnu" aria-label="Otevřít knihovnu">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3V7z"/></svg>
            </button>
            <button class="icon-btn" id="btn-refresh" data-i18n-title="action.refreshLibrary" data-i18n-aria-label="action.refreshLibrary" title="Obnovit" aria-label="Obnovit knihovnu">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
          </div>
          <button class="icon-btn mobile-only" id="btn-close-sidebar" data-i18n-title="action.closeLibrary" data-i18n-aria-label="action.closeLibrary" title="Zavřít" aria-label="Zavřít knihovnu">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="disk-actions web-only hidden" id="disk-actions">
          <button class="disk-btn" id="btn-export-library" type="button">Export ZIP</button>
          <button class="disk-btn" id="btn-export-note" type="button">Export .md</button>
          <button class="disk-btn" id="btn-import-files" type="button">Import .md</button>
          <button class="disk-btn desktop-chromium" id="btn-save-folder" type="button" data-i18n="disk.saveFolder">Uložit do složky</button>
          <input id="import-files" class="hidden" type="file" accept=".md,text/markdown,text/plain" multiple />
        </div>

        <div class="library-path" id="library-path" title="" data-i18n="library.none">Žádná knihovna</div>
        <div class="library-sort" role="group" data-i18n-aria-label="sort.group" aria-label="Řazení souborů">
          <label class="sr-only" for="sort-by" data-i18n="sort.byLabel">Řadit podle</label>
          <select id="sort-by">
            <option value="title" data-i18n="sort.byName">Názvu</option>
            <option value="createdAt" data-i18n="sort.byCreated">Data vytvoření</option>
          </select>
          <label class="sr-only" for="sort-direction" data-i18n="sort.directionLabel">Směr řazení</label>
          <select id="sort-direction">
            <option value="asc" data-i18n="sort.asc">Vzestupně ↑</option>
            <option value="desc" data-i18n="sort.desc">Sestupně ↓</option>
          </select>
        </div>
        <div class="note-list" id="note-list" role="list"></div>
      </aside>

      <div class="workspace">
        <header class="toolbar">
          <div class="toolbar-left">
            <button class="ghost-btn" id="btn-toggle-sidebar" data-i18n-title="toolbar.library" data-i18n-aria-label="toolbar.library" title="Knihovna" aria-label="Knihovna">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
            </button>
            <input class="title-input" id="note-title" data-i18n-placeholder="title.untitled" placeholder="Bez názvu" spellcheck="false" enterkeyhint="done" />
          </div>
          <div class="toolbar-right">
            <div class="font-picker" data-i18n-title="font.editor" title="Font editoru">
              <span class="font-picker-label" data-i18n="font.label">Font</span>
              <button type="button" class="font-select" id="font-select" aria-haspopup="listbox" aria-expanded="false" data-i18n-aria-label="font.editor" aria-label="Font editoru">
                <span id="font-select-label">Literata</span>
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="font-menu hidden" id="font-menu" role="listbox"></div>
            </div>
            <button class="chip-btn desktop-only" id="btn-focus" data-active="false" data-i18n="chip.focus" data-i18n-title="chip.focusTitle" title="Focus Mode — celá obrazovka bez rušivých prvků">Focus</button>
            <button class="chip-btn desktop-only" id="btn-typewriter" data-active="false" data-i18n="chip.typewriter" title="Typewriter">Typewriter</button>
            <button class="chip-btn" id="btn-preview" data-active="false" data-i18n="chip.preview" data-i18n-title="chip.previewTitle" title="Náhled">Preview</button>
            <button class="chip-btn" id="btn-locale" type="button" title="Language">English</button>
            <button class="chip-btn" id="btn-theme" data-i18n-title="chip.themeToggle" title="Přepnout motiv">Dark</button>
            <button class="chip-btn" id="btn-backlinks" data-active="false" data-i18n="chip.links" data-i18n-title="chip.linksTitle" title="Backlinky">Links</button>
          </div>
        </header>

        <div class="stage">
          <main class="editor-pane">
            <div id="editor-root" class="editor-root"></div>
            <div id="preview-pane" class="preview-pane hidden" tabindex="0" data-i18n-aria-label="preview.aria" aria-label="Náhled poznámky">
              <article id="preview-root" class="preview-root"></article>
            </div>
          </main>

          <aside class="backlinks-pane" id="backlinks-pane">
            <div class="sheet-handle mobile-only" aria-hidden="true"></div>
            <div class="backlinks-header">
              <h2 data-i18n="backlinks.title">Backlinky</h2>
              <span class="backlinks-count" id="backlinks-count">0</span>
              <button class="icon-btn mobile-only" id="btn-close-backlinks" data-i18n-title="action.closeBacklinks" data-i18n-aria-label="action.closeBacklinks" title="Zavřít" aria-label="Zavřít backlinky">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
            <p class="backlinks-hint" data-i18n="backlinks.hint">Poznámky, které odkazují sem přes <code>[[…]]</code>.</p>
            <div class="backlinks-list" id="backlinks-list"></div>
            <div class="outgoing-header">
              <h3 data-i18n="outgoing.title">Odchozí odkazy</h3>
            </div>
            <div class="outgoing-list" id="outgoing-list"></div>
          </aside>
        </div>

        <footer class="status-bar">
          <span id="status-words">0 slov</span>
          <span class="dot" aria-hidden="true"></span>
          <span id="status-chars">0 znaků</span>
          <span class="dot desktop-only" aria-hidden="true"></span>
          <span id="status-save" role="status" aria-live="polite" data-i18n="status.ready">Připraveno</span>
          <span class="spacer"></span>
          <span id="status-hint" class="desktop-only" data-i18n="status.hintDesktop">[[odkaz]] bez závorek · dvojklik otevře · Ctrl+N nová · Ctrl+P otevření</span>
        </footer>
      </div>

      <button type="button" class="focus-exit-btn hidden" id="btn-exit-focus" data-i18n-title="focus.exitTitle" data-i18n-aria-label="focus.exitAria" title="Opustit Focus (Esc)" aria-label="Opustit Focus Mode">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span data-i18n="focus.exit">Opustit Focus</span>
      </button>

      <div class="command-palette hidden" id="command-palette" role="dialog" aria-modal="true" data-i18n-aria-label="command.aria" aria-label="Otevřít poznámku">
        <div class="command-card">
          <input id="command-input" class="command-input" data-i18n-aria-label="command.inputAria" data-i18n-placeholder="command.placeholder" aria-label="Vyhledat poznámku" placeholder="Otevřít poznámku…" autocomplete="off" spellcheck="false" />
          <div id="command-results" class="command-results"></div>
        </div>
      </div>

      <div class="welcome hidden" id="welcome">
        <div class="welcome-card">
          <div class="brand-mark large" aria-hidden="true"></div>
          <h1>Folio</h1>
          <p id="welcome-copy" data-i18n="welcome.tagline">Soustředěné psaní ve stylu iA Writer — s propojenými poznámkami jako v Obsidianu.</p>
          <div class="welcome-actions">
            <button class="primary-btn" id="welcome-demo" data-i18n="welcome.demo">Začít s ukázkovou knihovnou</button>
            <button class="ghost-btn solid" id="welcome-open" data-i18n="welcome.openFolder">Otevřít jinou složku</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
